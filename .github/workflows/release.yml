name: Release (Windows)

# Triggered by pushing a tag like "v0.1.0" (should match package.json's
# "version" field — electron-builder names the GitHub release after
# package.json's version, not the tag itself). Can also be run manually from
# the Actions tab for a one-off test build.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # Publishes a draft GitHub release with the built installer attached
      # (see package.json's build.publish — releaseType is "draft" so nothing
      # goes live until you review and publish it manually on GitHub).
      - name: Build and publish
        run: npm run release:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
